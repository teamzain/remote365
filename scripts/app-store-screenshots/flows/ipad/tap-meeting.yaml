# Meeting tab: by name when Maestro can see it (it can on the Connect screen), else by position
appId: ai.remote365.mobile
---
- runFlow:
    when:
      visible: "Meeting"
    commands:
      - tapOn: "Meeting"
- runFlow:
    when:
      notVisible: "Meeting"
    commands:
      - tapOn:
          point: "57%,94%"
- waitForAnimationToEnd:
    timeout: 6000
