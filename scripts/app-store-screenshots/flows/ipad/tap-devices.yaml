# Devices tab: by name when Maestro can see it (it can on the Connect screen), else by position
appId: ai.remote365.mobile
---
- runFlow:
    when:
      visible: "Devices"
    commands:
      - tapOn: "Devices"
- runFlow:
    when:
      notVisible: "Devices"
    commands:
      - tapOn:
          point: "42%,94%"
- waitForAnimationToEnd:
    timeout: 6000
